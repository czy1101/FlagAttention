# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
    - name: Detect Python test changes
      id: filter
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "pull_request" ]; then
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
        elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq '.files[].filename' > changed-files.txt
        else
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Changed files:"
        sed 's/^/  /' changed-files.txt

        if grep -Eq '^(src/|tests/|pyproject\.toml$)' changed-files.txt; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_tests == 'true'
    runs-on: h20
    steps:
    - uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # - name: Set up Python 3.10
    #   uses: actions/setup-python@v3
    #   with:
    #     python-version: "3.10"

    # - name: Install dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install flake8 pytest
    #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    #     pip install .

    - name: Select Python environment
      shell: bash
      run: |
        set -euo pipefail

        shopt -s nullglob
        candidates=(
          /home/flagattn_ci/.virtualenvs/release/bin/python
          "$HOME"/.virtualenvs/*/bin/python
          /home/*/.virtualenvs/*/bin/python
          /home/*/.venvs/*/bin/python
          /home/*/miniconda*/bin/python
          /home/*/miniconda*/envs/*/bin/python
          /home/*/anaconda*/bin/python
          /home/*/anaconda*/envs/*/bin/python
          /opt/conda/bin/python
          /opt/conda/envs/*/bin/python
        )
        candidates+=("$(command -v python3 || true)" "$(command -v python || true)")

        python_bin=""
        for candidate in "${candidates[@]}"; do
          if [ -x "$candidate" ] && "$candidate" -c "import torch, triton" >/dev/null 2>&1; then
            python_bin="$candidate"
            break
          fi
        done

        if [ -z "$python_bin" ]; then
          venv="$RUNNER_TEMP/flagattention-venv"
          python3 -m venv "$venv"
          python_bin="$venv/bin/python"
          "$python_bin" -m pip install --upgrade pip
          "$python_bin" -m pip install "torch" "triton>=2.2.0" "pytest>=7.1.0"
        fi

        if ! "$python_bin" -c "import pytest" >/dev/null 2>&1; then
          venv="$RUNNER_TEMP/flagattention-venv"
          "$python_bin" -m venv --system-site-packages "$venv"
          "$venv/bin/python" -m pip install "pytest>=7.1.0"
          python_bin="$venv/bin/python"
        fi

        echo "$(dirname "$python_bin")" >> "$GITHUB_PATH"
        "$python_bin" -c "import torch, triton, pytest; print(torch.__version__, triton.__version__)"

    - name: Verify source import
      env:
        PYTHONPATH: src
      run: python -c "import flag_attn"

    # - name: Lint with flake8
    #   run: |
    #     # stop the build if there are Python syntax errors or undefined names
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #     # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
    #     flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest tests
