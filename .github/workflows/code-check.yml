# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
    - name: Detect Python test changes
      id: filter
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "pull_request" ]; then
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
        elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq '.files[].filename' > changed-files.txt
        else
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Changed files:"
        sed 's/^/  /' changed-files.txt

        if grep -Eq '^(src/|tests/|pyproject\.toml$)' changed-files.txt; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_tests == 'true'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # - name: Set up Python 3.10
    #   uses: actions/setup-python@v3
    #   with:
    #     python-version: "3.10"

    # - name: Install dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install flake8 pytest
    #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    #     pip install .

    - name: Activate Python environment
      shell: bash
      run: |
        set -euo pipefail

        venv=""
        shopt -s nullglob
        for candidate in \
          /home/flagattn_ci/.virtualenvs/release \
          "$HOME/.virtualenvs/release" \
          /home/*/.virtualenvs/release; do
          if [ -x "$candidate/bin/python" ]; then
            venv="$candidate"
            break
          fi
        done

        if [ -z "$venv" ]; then
          venv="$RUNNER_TEMP/flagattention-venv"
          python3 -m venv --system-site-packages "$venv"
        fi

        echo "$venv/bin" >> "$GITHUB_PATH"
        "$venv/bin/python" -c "import torch, triton"
        "$venv/bin/python" -c "import pytest" || "$venv/bin/python" -m pip install "pytest>=7.1.0"

    - name: Editable Install
      run: |
        python -m pip install --no-dependencies -e .

    # - name: Lint with flake8
    #   run: |
    #     # stop the build if there are Python syntax errors or undefined names
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #     # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
    #     flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest tests
